# Режим HOST: контейнер управляет сетью СЕРВЕРА.
# !!! НЕ запускать на рабочем компьютере — только на VM / выделенном сервере !!!
#
# Устанавливается и обновляется скриптом из корня проекта:
#   sudo ./install.sh            — установка (Docker, сеть сервера, первый router.yaml, запуск)
#   sudo ./install.sh --update   — пересобрать и перезапустить после update_pro_*.sh
# Параметры (порты, пароль первого входа, часовой пояс) — в файле .env рядом (его пишет install.sh).
name: outpost-gate-pro-host   # не путать с dev-запуском (docker-compose.yml в корне)
services:
  router:
    build:
      context: ../..
      network: host             # сборка в сети сервера: у Docker здесь iptables=false, NAT для сборки нет
    image: outpost-gate-pro:latest
    container_name: outpost-gate-pro
    restart: unless-stopped
    network_mode: host          # реальные интерфейсы сервера
    cap_add:
      - NET_ADMIN
      - NET_RAW
    # privileged: файловый сервер видит и монтирует диски сервера (вкладка Files → Диски).
    # Без дисков можно убрать privileged и вернуть строку device_cgroup_rules для /dev/ppp.
    privileged: true
    # device_cgroup_rules:
    #   - "c 108:0 rwm"    # /dev/ppp для L2TP (на хосте: sudo modprobe ppp_generic)
    environment:
      ROUTER_MODE: host
      API_HOST: 0.0.0.0         # слушать все адреса; доступ с WAN закрывает фаервол (галочка в LAN)
      API_PORT: "${API_PORT:-8000}"
      CLI_SSH_PORT: "${CLI_SSH_PORT:-2222}"   # SSH -> CLI роутера; порт 22 оставлен SSH самого сервера
      HOST_SSH_PORT: "${HOST_SSH_PORT:-22}"   # SSH сервера: фаервол роутера не закроет его с WAN
      ROUTER_DISKS: "1"         # управление дисками во вкладке Files
      ROUTER_ADMIN_PASSWORD: "${ROUTER_ADMIN_PASSWORD:-}"   # только при самом первом запуске
      TZ: "${TZ:-UTC}"
    volumes:
      - /etc/outpost-gate-pro:/etc/outpost-gate-pro
      - /var/lib/outpost-gate-pro:/var/lib/outpost-gate-pro
      - /dev:/dev                # диски, подключённые после запуска (USB)
      - /run/udev:/run/udev:ro   # метки и UUID разделов
